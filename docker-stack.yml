services:
  postgis:
    image: postgis/postgis:17-3.5
    container_name: postgis
    environment:
      POSTGRES_PASSWORD: ${POSTGIS_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./ect69-geo-decoding/scripts/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  superset:
    image: apache/superset:latest
    container_name: superset
    ports:
      - "8088:8088"
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${POSTGIS_PASSWORD}

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "5050:80"
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  nominatim:
    image: mediagis/nominatim:5.2
    container_name: nominatim
    environment:
      - PBF_URL=https://download.geofabrik.de/asia/thailand-latest.osm.pbf
      - REPLICATION_URL=https://download.geofabrik.de/asia/thailand-updates/
    ports:
      - "8080:8080"
    volumes:
      - nominatim_data:/var/lib/postgresql/14/main
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/status | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 300s

  geocoder:
    build:
      context: ./ect69-geo-decoding/scripts
      dockerfile: Dockerfile.geocoder
    container_name: geocoder
    restart: on-failure
    depends_on:
      nominatim:
        condition: service_healthy
    environment:
      - GISTDA_API_KEY_FILE=/run/secrets/gistda_api_key
      - NOMINATIM_URL=http://nominatim:8080/search
    secrets:
      - gistda_api_key
    volumes:
      - ./ect69-geo-decoding/intermediate:/data/intermediate:ro
      - ./ect69-geo-decoding/outputs:/data/outputs
    command:
      - /data/intermediate/ect69_voting_units_cleaned.parquet
      - /data/outputs/ect69_main_geocoded.parquet
      - "0"

secrets:
  gistda_api_key:
    file: ./secrets/gistda_api_key.txt

volumes:
  postgis_data:
  pgadmin_data:
  nominatim_data:
