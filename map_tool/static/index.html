<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Map Tool</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.1.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="map"></div>
  <div id="layer-panel">
    <div id="layer-panel-header">
      <span>Layers</span>
      <span id="layer-count">0</span>
    </div>
    <div id="layer-list"></div>
  </div>
  <div id="status-bar">Connecting...</div>

  <script src="https://unpkg.com/maplibre-gl@5.1.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@turf/turf@7.2.0/turf.min.js"></script>
  <script src="https://unpkg.com/h3-js@4.2.1/dist/h3-js.umd.js"></script>
  <script src="/static/map.js"></script>

</html>
